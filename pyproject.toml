[project]
name = "one-shot-api"
version = "0.1.0"
description = "An API for generating RPG one-shot stories using AI agents"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "langchain>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.11.0",
    "pre-commit>=3.6.0",
    "black>=24.0.0",
    "types-all>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "TRY", # tryceratops
    "FBT", # flake8-boolean-trap
    "C90", # mccabe
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "TID252", # relative imports
    "PTH120", # os.path usage
    "PTH100", # os.path usage
    "ERA001", # commented out code
    "W293",   # blank line contains whitespace
    "TRY300", # else block suggestion
    "RET504", # unnecessary assignment
    "B904",   # raise from suggestion
    "PGH003", # type ignore comments
    "ARG001", # unused arguments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow use of assert in tests
"**/__init__.py" = ["F401"]  # Allow unused imports in __init__.py files
"alembic/*" = ["ERA001", "PTH120", "PTH100", "PGH003", "ARG001"]  # Allow commented code and os.path usage in alembic files
"src/one_shot_api/api/*" = ["PGH003", "ARG001"]  # Allow type ignores and unused args in API routes

[tool.ruff.lint.isort]
known-first-party = ["one_shot_api"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false  # Allow Any return types
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # Allow unused type ignores
warn_no_return = true
warn_unreachable = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "alembic.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_unused_ignores = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "src.one_shot_api.api.*"
disallow_untyped_defs = false
warn_unused_ignores = false
warn_return_any = false

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Skip assert warnings
