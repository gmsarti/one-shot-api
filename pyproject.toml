[project]
name = "one-shot-api"
version = "0.1.0"
description = "An API for generating RPG one-shot stories using AI agents"
authors = [
    {name = "Gustavo Sarti", email = "gustavo.sarti@gmail.com"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.27.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.3.0",
    "langchain_openai>=0.0.5",
    "alembic>=1.13.1",
    "psutil>=5.9.8"
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.11.0",
    "pre-commit>=3.6.0",
    "black>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # Only basic errors and pyflakes
ignore = ["E501"]  # Ignore line length (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # Allow unused imports in tests
"**/__init__.py" = ["F401"]  # Allow unused imports in __init__.py files
"alembic/*" = ["ERA001", "PTH120", "PTH100", "PGH003", "ARG001"]  # Allow commented code and os.path usage in alembic files
"src/one_shot_api/api/*" = ["PGH003", "ARG001"]  # Allow type ignores and unused args in API routes

[tool.ruff.lint.isort]
known-first-party = ["one_shot_api"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Skip assert warnings

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src/one_shot_api --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/one_shot_api"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError"
]

[tool.hatch.build.targets.wheel]
packages = ["src/one_shot_api"]
