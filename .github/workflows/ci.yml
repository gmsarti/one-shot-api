name: CI/CD Pipeline

on:
  push:
    branches: [ development, 'feature/**' ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test_db
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-3.5-turbo
      OPENAI_API_KEY: dummy_key
      DEFAULT_RPG_SYSTEM: dnd5e
      DEFAULT_STORY_LENGTH: medium
      DEFAULT_THEME: fantasy

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov pre-commit pytest-asyncio

    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files

    - name: Run tests
      run: |
        pytest --cov=src tests/ --cov-fail-under=60

  build-docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: one-shot-api:latest
